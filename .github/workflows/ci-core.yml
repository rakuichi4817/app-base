name: 【CI】Python Core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python Coreの検証
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 変更対象の判定
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --no-renames --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
          if grep -Eq '^(projects/core/|mise\.toml$|\.github/workflows/)' "$RUNNER_TEMP/changed-files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: github.event_name != 'pull_request' || steps.changes.outputs.run == 'true'
      - name: 依存の導入
        if: github.event_name != 'pull_request' || steps.changes.outputs.run == 'true'
        run: mise run //projects/core:install
      - name: Lint・型チェック
        if: github.event_name != 'pull_request' || steps.changes.outputs.run == 'true'
        run: mise run //projects/core:lint
      - name: テスト
        if: github.event_name != 'pull_request' || steps.changes.outputs.run == 'true'
        run: mise run //projects/core:test
      - name: ライセンスの一次検査
        if: github.event_name != 'pull_request' || steps.changes.outputs.run == 'true'
        run: mise run //projects/core:license
