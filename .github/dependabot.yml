version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "依存関係の更新："
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directories:
      - /projects/core
      - /projects/app/backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "依存関係の更新："
    groups:
      python-patch:
        patterns: ["*"]
        update-types: ["patch"]
      python-minor:
        patterns: ["*"]
        update-types: ["minor"]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /projects/app/frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "依存関係の更新："
    groups:
      frontend-patch:
        patterns: ["*"]
        update-types: ["patch"]
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor"]
    open-pull-requests-limit: 5
