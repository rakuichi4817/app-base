[project]
name = "app-base-core"
version = "0.1.0"
description = "フレームワークに依存しない共通ロジックの最小例"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18", "ty>=0.0.81,<0.1"]
license = [
    "pip-licenses>=5.5.5",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ty.environment]
python = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
