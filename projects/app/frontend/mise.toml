[tasks.install]
description = "フロントエンドの依存を導入する"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Vite開発サーバーを起動する"
run = "pnpm dev"

[tasks.lint]
description = "ESLint・Prettier・vue-tsc"
run = "pnpm lint"

[tasks.format]
description = "ESLint自動修正・Prettier整形"
run = "pnpm format"

[tasks.test]
description = "Vitestによる単体・コンポーネントテスト"
run = "pnpm test"

[tasks.build]
description = "型チェックと本番ビルド"
run = "pnpm build"

[tasks.storybook]
run = "pnpm storybook"

[tasks."storybook:build"]
run = "pnpm build-storybook"

[tasks."storybook:test"]
run = "pnpm test-storybook"

[tasks."browser:install"]
run = "pnpm exec playwright install chromium"

[tasks."browser:deps"]
run = "pnpm exec playwright install-deps chromium"

[tasks.license]
description = "フロントエンドの依存ライセンスを一覧保存・一次検査する"
run = [
  "mkdir -p reports",
  "pnpm exec license-checker-rseidelsohn --json --excludePrivatePackages --out reports/licenses.json",
  "pnpm exec license-checker-rseidelsohn --excludePrivatePackages --onlyAllow 'MIT;MIT-0;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;BlueOak-1.0.0;CC0-1.0;MPL-2.0;CC-BY-3.0' --summary",
]
