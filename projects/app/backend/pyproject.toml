[project]
name = "app-base-backend"
version = "0.1.0"
description = "FastAPIの最小サンプル"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["app-base-core", "fastapi>=0.162,<1", "uvicorn>=0.40,<1"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
app-base-core = { path = "../../core", editable = true }

[dependency-groups]
dev = ["httpx2>=2.16,<3", "pytest>=9,<10", "ruff>=0.17,<0.18", "ty>=0.0.81,<0.1"]
license = [
    "pip-licenses>=5.5.5",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ty.environment]
python = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
